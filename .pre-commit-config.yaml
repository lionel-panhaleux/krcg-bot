---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^ansible/vault\.yml$
      - id: check-merge-conflict

  - repo: local
    hooks:
      # the repo is public and the vault holds a live bot token: check-yaml is
      # happy with plaintext, so refuse anything without the vault header
      - id: vault-encrypted
        name: ansible vault is encrypted
        entry: sh -c 'head -1 ansible/vault.yml | grep -q "^\$ANSIBLE_VAULT" || { echo "ansible/vault.yml is NOT encrypted"; exit 1; }'
        language: system
        files: ^ansible/vault\.yml$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
