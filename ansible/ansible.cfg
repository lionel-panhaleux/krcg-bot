[defaults]
inventory = inventory.yml
interpreter_python = /usr/bin/python3
; git-ignored; decrypt secrets/vault-pass.age into it (see README). CI writes
; its own from the ANSIBLE_VAULT_PASSWORD secret, so both paths are one path.
vault_password_file = .vault_pass
# readable diffs on one host (the `yaml` callback plugin itself is gone since
# community.general 12.0.0 — this is its replacement)
result_format = yaml

[privilege_escalation]
become_method = sudo
