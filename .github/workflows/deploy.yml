name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (default: the latest release)"
        required: false

# never two converges at once: the gateway must not be started twice on one token
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # DEPLOY_SSH_KEY and ANSIBLE_VAULT_PASSWORD are secrets here; DEPLOY_HOST
    # and DEPLOY_HOST_KEY are variables
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.13"

      # the release carries the wheel, and this deploys that exact file. Building
      # a second one here would mean two artifacts claiming to be one release —
      # and it is what makes redeploying an older release possible.
      - name: Download the release wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern '*.whl' --dir dist --clobber
          else
            gh release download --pattern '*.whl' --dir dist --clobber
          fi
          count=$(ls dist/*.whl | wc -l)
          [ "$count" -eq 1 ] || { echo "expected one wheel on the release, got $count"; exit 1; }
          ls -l dist/*.whl

      # written to the path ansible.cfg already points at, so CI and the laptop
      # run one command — there, age-decrypted from secrets/vault-pass.age
      - name: Write the vault password
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > ansible/.vault_pass
          chmod 600 ansible/.vault_pass

      # a YAML-valid typo would otherwise surface on the live host, after the
      # unit has already been overwritten
      - name: Check the playbook
        working-directory: ansible
        run: uv run --group deploy ansible-playbook deploy.yml --syntax-check

      # DEPLOY_HOST and DEPLOY_HOST_KEY are repo *variables*, not secrets —
      # `secrets.DEPLOY_HOST` resolves to the empty string and fails at connect
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Converge
        working-directory: ansible
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          ANSIBLE_PRIVATE_KEY_FILE: ~/.ssh/id_deploy
        run: |
          uv run --group deploy ansible-playbook deploy.yml \
            -e wheel="$(ls ../dist/*.whl)"

      - name: Drop the credentials
        if: always()
        run: rm -f ansible/.vault_pass ~/.ssh/id_deploy
