[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[project]
name = "krcg-bot"
version = "4.10"
description = "Discord bot for VTES cards"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lionelpx", email = "lionel.panhaleux@gmail.com" }]
maintainers = [{ name = "lionelpx", email = "lionel.panhaleux@gmail.com" }]
keywords = ["vampire", "vtes", "ccg", "discord", "bot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Environment :: Plugins",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.13"
dependencies = ["aiohttp", "hikari>=2.5,<3", "krcg>=5.9,<6", "unidecode"]

[dependency-groups]
dev = ["ipython", "pytest", "ruff", "ty"]
# deploy only: kept out of dev so CI and contributors never install Ansible
deploy = ["ansible"]

[project.urls]
Homepage = "https://github.com/lionel-panhaleux/krcg-bot"
Repository = "https://github.com/lionel-panhaleux/krcg-bot"
Issues = "https://github.com/lionel-panhaleux/krcg-bot/issues"

[project.scripts]
krcg-bot = "krcg_bot:main"

[tool.ruff]
line-length = 100
target-version = "py313"
